# RoadPulse produksi: PostgreSQL + Django/Gunicorn + Caddy (HTTPS otomatis, dashboard web, /media).
# Pemakaian (dari folder deploy/):
#   cp .env.example .env   # lalu isi
#   docker compose up -d --build
name: roadpulse

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-roadpulse}
      POSTGRES_USER: ${DB_USER:-roadpulse}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?Isi SECRET_KEY di deploy/.env}
      ALLOWED_HOSTS: ${DOMAIN:?Isi DOMAIN di deploy/.env},localhost
      CSRF_TRUSTED_ORIGINS: https://${DOMAIN}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      DB_ENGINE: postgresql
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-roadpulse}
      DB_USER: ${DB_USER:-roadpulse}
      DB_PASSWORD: ${DB_PASSWORD}
      NUM_PROXIES: "1"
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      THROTTLE_CLASSIFY: ${THROTTLE_CLASSIFY:-120/hour}
      PRIVACY_CONTACT_EMAIL: ${PRIVACY_CONTACT_EMAIL:-}
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    expose:
      - "8000"

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Isi ACME_EMAIL di deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../frontend:/srv/frontend:ro
      - media:/srv/media:ro
      - static:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  media:
  static:
  caddy_data:
  caddy_config:
