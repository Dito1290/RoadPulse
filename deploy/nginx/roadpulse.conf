# Server block nginx untuk RoadPulse di server kampus (domain lewat Cloudflare proxy).
# HTTPS memakai sertifikat Cloudflare Origin (*.iet-polinela.my.id) yang SUDAH ADA di server,
# jadi TIDAK perlu certbot. __CERT__ dan __KEY__ diganti otomatis oleh perintah di panduan:
#   sed -e "s#__CERT__#$CERT#" -e "s#__KEY__#$KEY#" roadpulse.conf | sudo tee "$FILE"
# Ganti 8086 bila memakai ROADPULSE_PORT lain di deploy/.env.
server {
    listen 80;
    listen 443 ssl;
    server_name roadpulse.iet-polinela.my.id;

    ssl_certificate     __CERT__;
    ssl_certificate_key __KEY__;

    # IP asli pengunjung dari Cloudflare (tanpa ini semua pengunjung terlihat sebagai
    # IP Cloudflare dan batas percobaan login berlaku bersama). Sumber: cloudflare.com/ips
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Protokol asli pengunjung: dari Cloudflare bila ada, kalau tidak dari koneksi ke nginx.
    # Aman untuk mode SSL Cloudflare "Flexible" maupun "Full" (mencegah redirect tanpa henti).
    set $rp_proto $scheme;
    if ($http_x_forwarded_proto = "https") {
        set $rp_proto https;
    }

    # Foto maksimal 10 MB; default nginx hanya 1 MB (-> error 413)
    client_max_body_size 12M;

    access_log /var/log/nginx/roadpulse.access.log;
    error_log  /var/log/nginx/roadpulse.error.log;

    location / {
        proxy_pass http://127.0.0.1:8086;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $rp_proto;
        proxy_read_timeout 130s;
    }
}
