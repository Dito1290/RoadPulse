# Server block nginx untuk RoadPulse di server bersama.
# Salin HANYA isi blok ini ke file config nginx milik roadpulse (jangan sentuh file kelompok lain).
# Ganti 8086 bila memakai ROADPULSE_PORT lain di deploy/.env.
# Setelah ini: sudo nginx -t && sudo systemctl reload nginx, lalu certbot --nginx menambahkan HTTPS.
server {
    listen 80;
    server_name roadpulse.iet-polinela.my.id;

    # Foto maksimal 10 MB; default nginx hanya 1 MB (-> error 413)
    client_max_body_size 12M;

    access_log /var/log/nginx/roadpulse.access.log;
    error_log  /var/log/nginx/roadpulse.error.log;

    location / {
        proxy_pass http://127.0.0.1:8086;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        # Wajib: Django memakai HTTPS redirect, tanpa ini halaman redirect tanpa henti
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;
    }
}
