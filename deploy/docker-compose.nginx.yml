# RoadPulse untuk SERVER BERSAMA yang sudah memakai nginx di port 80/443
# (mis. server kampus roadpulse.iet-polinela.my.id).
#
# Beda dengan docker-compose.yml (VPS sendiri):
#   - TIDAK membuka port 80/443 dan TIDAK mengurus HTTPS. HTTPS dipegang nginx server (sertifikat Cloudflare Origin / certbot).
#   - Semua layanan hanya bisa diakses dari server itu sendiri lewat 127.0.0.1:${ROADPULSE_PORT}.
#     nginx server meneruskan https://DOMAIN -> http://127.0.0.1:${ROADPULSE_PORT} (lihat nginx/roadpulse.conf).
#
# Pemakaian (dari folder deploy/):
#   cp .env.example .env   # isi DOMAIN, SECRET_KEY, DB_PASSWORD, ROADPULSE_PORT
#   sudo docker compose -f docker-compose.nginx.yml up -d --build
name: roadpulse

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-roadpulse}
      POSTGRES_USER: ${DB_USER:-roadpulse}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?Isi SECRET_KEY di deploy/.env}
      ALLOWED_HOSTS: ${DOMAIN:?Isi DOMAIN di deploy/.env},localhost
      CSRF_TRUSTED_ORIGINS: https://${DOMAIN}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      DB_ENGINE: postgresql
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-roadpulse}
      DB_USER: ${DB_USER:-roadpulse}
      DB_PASSWORD: ${DB_PASSWORD}
      # 2 proxy di depan Django: nginx server -> Caddy internal.
      NUM_PROXIES: "2"
      # Server dipakai bersama: 1 worker (±300 MB RAM karena model AI).
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
      THROTTLE_CLASSIFY: ${THROTTLE_CLASSIFY:-120/hour}
      PRIVACY_CONTACT_EMAIL: ${PRIVACY_CONTACT_EMAIL:-}
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    expose:
      - "8000"

  # Web server internal (HTTP saja): dashboard, /media, /static, dan proxy ke Django.
  web:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Hanya 127.0.0.1: tidak terbuka ke internet, tidak bentrok dengan nginx/kelompok lain.
      - "127.0.0.1:${ROADPULSE_PORT:-8086}:80"
    volumes:
      - ./Caddyfile.internal:/etc/caddy/Caddyfile:ro
      - ../frontend:/srv/frontend:ro
      - media:/srv/media:ro
      - static:/srv/static:ro

volumes:
  pgdata:
  media:
  static:
